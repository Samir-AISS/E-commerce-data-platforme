name: Data Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  pipeline:
    name: Validate & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install pandas numpy sqlalchemy python-dotenv pytest

      - name: Validate project structure
        run: |
          python -c "
          from pathlib import Path

          # Check required files (case-insensitive for docs)
          required_exact = [
              'dbt/dbt_project.yml',
              'dbt/models/bronze/bronze_orders.sql',
              'dbt/models/silver/silver_orders.sql',
              'dbt/models/gold/gold_revenue_daily.sql',
              'ingestion/load_to_postgres.py',
              'ingestion/validate_data.py',
              'dashboard/App.py',
              'docker-compose.yml',
          ]
          required_docs = ['architecture', 'data_dictionary', 'pipeline', 'dbt_models']

          missing = [f for f in required_exact if not Path(f).exists()]

          # Check docs case-insensitive
          docs_files = [f.stem.lower() for f in Path('docs').glob('*.md')] if Path('docs').exists() else []
          missing_docs = [d for d in required_docs if d not in docs_files]

          if missing or missing_docs:
              for f in missing: print(f'Missing: {f}')
              for d in missing_docs: print(f'Missing doc: docs/{d}.md')
              exit(1)

          print(f'All {len(required_exact)} required files present')
          print(f'All {len(required_docs)} docs present: {docs_files}')
          "

      - name: Validate Python syntax
        run: |
          python -m py_compile ingestion/load_to_postgres.py
          python -m py_compile ingestion/validate_data.py
          python -m py_compile dashboard/App.py
          python -m py_compile scripts/export_to_pkl.py
          echo "All Python files compile successfully"

      - name: Check dbt SQL files
        run: |
          python -c "
          from pathlib import Path
          sql_files = list(Path('dbt/models').rglob('*.sql'))
          print(f'Found {len(sql_files)} dbt SQL models')
          for f in sql_files:
              content = f.read_text()
              assert len(content) > 10, f'{f} is empty'
          print('All dbt models are non-empty')
          "